name: devcontainer-editor-measure

# Measure a dev container as VS Code attaches to it, on a disposable machine, through
# scripts/measure_devcontainer_editor.sh. It holds no secrets.

on:
  workflow_dispatch:
  push:
    branches: [measure-agents-with-stub]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: bash scripts/measure_devcontainer_editor.sh "$RUNNER_TEMP/editor"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devcontainer-editor
          path: |
            examples/devcontainer/devcontainer-editor-*
            editor-logs/
          if-no-files-found: warn
