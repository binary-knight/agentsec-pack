name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # bubblewrap exercises the sandbox presets for real. Docker is present on
      # the GitHub runner, so the container presets run too; tests that need a
      # binary skip when it is missing rather than failing.
      - name: Install sandbox tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Tests
        run: python -m pytest -q

  no-operator-identity:
    # The leak check on its own job, so it is legible in the checks list: this
    # is the failure that matters most on the day the repo goes public.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_probe.py -k operator_identity
