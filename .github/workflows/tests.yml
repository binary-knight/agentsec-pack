name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installing bubblewrap is not enough. Ubuntu 24.04 denies unprivileged
      # user namespaces by default, so bwrap is on PATH and still cannot build a
      # sandbox. Lift the restriction where we are allowed to; where we are not,
      # the suite detects the missing capability and skips rather than failing.
      - name: Install sandbox tools
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "bwrap can sandbox: $(bwrap --ro-bind / / --unshare-user --unshare-pid \
            --dev /dev --proc /proc true && echo yes || echo no)"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Tests
        run: python -m pytest -q

  no-operator-identity:
    # The leak check on its own job, so it is legible in the checks list: this
    # is the failure that matters most on the day the repo goes public.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_probe.py -k operator_identity
