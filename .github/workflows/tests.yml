name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Installing bubblewrap is not enough. Ubuntu 24.04 denies unprivileged
      # user namespaces by default, so bwrap is on PATH and still cannot build a
      # sandbox. Lift the restriction where we are allowed to; where we are not,
      # the suite detects the missing capability and skips rather than failing.
      - name: Install sandbox tools
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "bwrap can sandbox: $(bwrap --ro-bind / / --unshare-user --unshare-pid \
            --dev /dev --proc /proc true && echo yes || echo no)"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Tests
        run: python -m pytest -q

  no-operator-identity:
    # The leak check on its own job, so it is legible in the checks list: this
    # is the failure that matters most on the day the repo goes public.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_probe.py -k operator_identity

  security:
    # GitHub's own secret scanning and code scanning need a public repo or a
    # purchased Advanced Security licence. These are the free equivalents, and
    # they run on every push regardless of visibility.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[security]'

      - name: Secrets (detect-secrets against the audited baseline)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Known-vulnerable dependencies
        run: pip-audit --skip-editable

      - name: Python security lint
        run: bandit -r agentsec --severity-level high

  action:
    # The GitHub Action in action.yml, used the way a consumer would use it.
    # It must pass a hardened container, fail a loose one, and not fail a run
    # that is strictly better than its baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: A hardened container passes a budget of 0
        id: hardened
        uses: ./
        with:
          image: python:3.12-slim
          preset: docker-hardened
          max-score: "0"
          label: hardened

      - name: A default container fails a budget of 10
        id: loose
        continue-on-error: true
        uses: ./
        with:
          image: python:3.12-slim
          preset: docker-default
          max-score: "10"
          label: loose

      - name: Flags instead of a preset, gated on the loose run as baseline
        id: flags
        uses: ./
        with:
          image: python:3.12-slim
          flags: --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 65534:65534 --tmpfs /tmp
          baseline: agentsec-reports/loose.json
          label: flags

      - name: The outcomes and outputs are what they should be
        env:
          HARDENED: ${{ steps.hardened.outputs.score }}
          LOOSE_OUTCOME: ${{ steps.loose.outcome }}
          LOOSE: ${{ steps.loose.outputs.score }}
          FLAGS: ${{ steps.flags.outputs.score }}
        run: |
          set -x
          [ "$HARDENED" = "0" ]
          [ "$LOOSE_OUTCOME" = "failure" ]
          [ -n "$LOOSE" ] && [ "$LOOSE" -gt 10 ]
          [ -n "$FLAGS" ] && [ "$FLAGS" -lt "$LOOSE" ]
          test -s agentsec-reports/hardened.html
