name: devcontainer-measure

# Measure dev containers on a disposable machine and keep the reports, through
# scripts/measure_devcontainer.sh. Started by hand only, and it holds no secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: bash scripts/measure_devcontainer.sh "$RUNNER_TEMP/devcontainer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devcontainer-reports
          path: examples/devcontainer/
          if-no-files-found: warn
