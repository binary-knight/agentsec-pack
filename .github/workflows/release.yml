name: release

# Publishes agentsec-pack to PyPI when a version tag is pushed, and only then.
# Nothing here runs on an ordinary push or pull request.
#
# Uses PyPI trusted publishing (OIDC): no API token is stored anywhere. Before
# the first release, a maintainer has to register this workflow as a trusted
# publisher on PyPI and create the `pypi` environment here; CONTRIBUTING.md
# lists the steps.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The tag must match the version being published
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $v" >&2
            exit 1
          fi

      - name: The changelog must have a section for this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## ${v} " CHANGELOG.md || { echo "CHANGELOG.md has no '## ${v} ' section" >&2; exit 1; }

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      # The source tree working is not the installed package working: the HTML
      # template was once missing from the wheel while every test passed. Install
      # what is about to be published, in a clean environment, and use it.
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/agentsec presets
          /tmp/wheel-env/bin/agentsec blast-radius local --out /tmp/smoke
          /tmp/wheel-env/bin/agentsec report /tmp/smoke --out /tmp/smoke/report.html
          test -s /tmp/smoke/report.html

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A protected environment: add a required reviewer to it, so a pushed tag
    # waits for a person before anything reaches PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/agentsec-pack/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # After PyPI has the files: a GitHub Release whose notes are this
    # version's section of CHANGELOG.md, so the two never say different things.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v " " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "agentsec-pack $v" --notes-file notes.md
